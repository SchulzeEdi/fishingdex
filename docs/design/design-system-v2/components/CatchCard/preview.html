<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>CatchCard — fishingdex</title></head>
<body>
<div class="fd-stage" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,360px));">
 <article class="fd-catch">
  <header class="fd-catch-head"><span class="fd-avatar">RS</span><div class="fd-catch-who"><b>Rafael <span class="fd-flag">BR</span></b><span>há 2 h · Rio Araguaia, GO</span></div></header>
  <div class="fd-photo" role="img" aria-label="Foto da captura"><i class="fd-icon fd-i-fish-silhouette " aria-hidden="true"></i><span class="fd-photo-tag"><i class="fd-icon fd-i-trophy fd-icon-xs" aria-hidden="true"></i>2º no ranking</span></div>
  <div class="fd-catch-body"><div class="fd-catch-title"><h3>Tucunaré-açu</h3><em>62 cm</em></div><div class="fd-chips"><span class="fd-chip">Isca <b>Zara</b></span><span class="fd-chip">Vara <b>14 lb</b></span></div></div>
  <footer class="fd-catch-foot"><button class="fd-icon-btn is-on" aria-pressed="true" aria-label="Curtir"><i class="fd-icon fd-i-heart-fill " aria-hidden="true"></i><span class="fd-num">24</span></button><button class="fd-icon-btn" aria-label="Ver ficha"><i class="fd-icon fd-i-chevron-right " aria-hidden="true"></i></button></footer>
 </article>
 <article class="fd-catch">
  <header class="fd-catch-head"><span class="fd-avatar">AN</span><div class="fd-catch-who"><b>Ana <span class="fd-flag">AR</span></b><span>ontem</span></div></header>
  <div class="fd-photo" role="img" aria-label="Foto da captura"><i class="fd-icon fd-i-fish-silhouette " aria-hidden="true"></i></div>
  <div class="fd-catch-body"><div class="fd-catch-title"><h3>Dourado</h3><em>58 cm</em></div><div class="fd-chips"><span class="fd-chip">Isca <b>Colher</b></span><span class="fd-chip"><i class="fd-icon fd-i-lock fd-icon-xs" aria-hidden="true"></i>Local privado</span></div></div>
  <footer class="fd-catch-foot"><button class="fd-icon-btn" aria-pressed="false" aria-label="Curtir"><i class="fd-icon fd-i-heart " aria-hidden="true"></i><span class="fd-num">12</span></button><button class="fd-icon-btn" aria-label="Ver ficha"><i class="fd-icon fd-i-chevron-right " aria-hidden="true"></i></button></footer>
 </article>
</div>
</body>
</html>

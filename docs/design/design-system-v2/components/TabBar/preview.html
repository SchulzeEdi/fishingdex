<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>TabBar — fishingdex</title></head>
<body>
<div style="padding-top:40px;max-width:var(--content-max);margin:0 auto">
<nav class="fd-tabbar" role="tablist" aria-label="Principal">
 <button class="fd-tab" role="tab" aria-selected="true"><i class="fd-icon fd-i-feed " aria-hidden="true"></i>Feed</button>
 <button class="fd-tab" role="tab" aria-selected="false"><i class="fd-icon fd-i-trophy " aria-hidden="true"></i>Ranking</button>
 <button class="fd-tab-fab" aria-label="Registrar captura"><i class="fd-icon fd-i-plus " aria-hidden="true"></i></button>
 <button class="fd-tab" role="tab" aria-selected="false"><i class="fd-icon fd-i-fish " aria-hidden="true"></i>Dex</button>
 <button class="fd-tab" role="tab" aria-selected="false"><i class="fd-icon fd-i-user " aria-hidden="true"></i>Perfil</button>
</nav></div>
</body>
</html>

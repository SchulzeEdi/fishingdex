<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Button — fishingdex</title></head>
<body>
<div class="fd-stage" style="flex-direction:column">
 <div class="fd-stage" style="padding:0">
  <button class="fd-btn fd-btn-primary">Registrar captura</button>
  <button class="fd-btn fd-btn-secondary">Ver ficha</button>
  <button class="fd-btn fd-btn-ghost">Pular</button>
  <button class="fd-btn fd-btn-danger">Excluir captura</button>
 </div>
 <div class="fd-stage" style="padding:0">
  <button class="fd-btn fd-btn-pro"><i class="fd-icon fd-i-star-fill fd-icon-sm" aria-hidden="true"></i>Assinar Pro</button>
  <button class="fd-btn fd-btn-whatsapp"><i class="fd-icon fd-i-message fd-icon-sm" aria-hidden="true"></i>Falar no WhatsApp</button>
 </div>
 <div class="fd-stage" style="padding:0">
  <button class="fd-btn fd-btn-primary is-pressed">Pressionado</button>
  <button class="fd-btn fd-btn-primary is-loading" aria-busy="true">Salvando</button>
  <button class="fd-btn fd-btn-secondary is-loading" aria-busy="true">Salvando</button>
  <button class="fd-btn fd-btn-primary" disabled>Desabilitado</button>
 </div>
</div>
</body>
</html>

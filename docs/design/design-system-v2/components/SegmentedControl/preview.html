<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>SegmentedControl — fishingdex</title></head>
<body>
<div class="fd-stage">
 <div class="fd-seg" role="tablist" aria-label="Habitat">
  <button role="tab" aria-selected="true"><i class="fd-icon fd-i-fish fd-icon-sm" aria-hidden="true"></i>Água doce <span class="fd-seg-count">12/48</span></button>
  <button role="tab" aria-selected="false"><i class="fd-icon fd-i-feed fd-icon-sm" aria-hidden="true"></i>Salgada <span class="fd-seg-count">3/40</span></button>
 </div>
 <div class="fd-seg" role="tablist" aria-label="Período">
  <button role="tab" aria-selected="false">Mês</button><button role="tab" aria-selected="true">Ano</button><button role="tab" aria-selected="false">Sempre</button>
 </div>
</div>
</body>
</html>

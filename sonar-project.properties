# Configuração do scanner SonarQube/SonarCloud — ver ADR-0006 e docs/ci/sonarcloud-setup.md
# SonarCloud: a chave e a organização são criadas no site (troque pelos seus valores).
sonar.projectKey=SchulzeEdi_fishingdex
sonar.organization=schulzeedi
sonar.projectName=fishingdex

# Código-fonte e testes (ajustar quando o app Expo for criado)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/.expo/**,**/dist/**,**/build/**,**/*.d.ts,docs/design/prototype/**

# Cobertura (Vitest gera coverage/lcov.info com o script test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Análise de novos códigos em PR
sonar.sourceEncoding=UTF-8

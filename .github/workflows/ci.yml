# CI/CD do fishingdex — gates da constitution + scanner de segurança (SonarQube/SonarCloud)
# Ver ADR-0006. Roda em PR e no push para main.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # 1) Gates da constitution (tipos, lint, testes com cobertura, build) + checks do harness
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run --if-present typecheck
      - name: lint (inclui fronteiras FSD)
        run: npm run --if-present lint
      - name: test (com cobertura p/ Sonar)
        run: npm run --if-present test:coverage
      - name: build
        run: npm run --if-present build
      - name: validate-state (harness)
        run: '[ -f scripts/sdd/validate-state.mjs ] && node scripts/sdd/validate-state.mjs || echo "skip"'
      - name: check-docs (harness)
        run: '[ -f scripts/sdd/check-docs.mjs ] && node scripts/sdd/check-docs.mjs || echo "skip"'
      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  # 1b) Integração: camada de dados contra Postgres/PostGIS real (migrations + repos)
  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fishingdex
          POSTGRES_PASSWORD: fishingdex_dev_pw
          POSTGRES_DB: fishingdex
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fishingdex -d fishingdex"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://fishingdex:fishingdex_dev_pw@localhost:5432/fishingdex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: migrate + seed
        run: npm run db:reset
      - name: integration tests
        run: npm run test:integration

  # 2) Segurança: dependências (npm audit) + scanner SonarQube/SonarCloud com Quality Gate
  security:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar precisa do histórico p/ blame/novos códigos
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true   # audit não bloqueia; o gate de segurança é o Sonar
      - name: test:coverage (gera lcov p/ Sonar)
        run: npm run --if-present test:coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Para SonarCloud, deixe assim. Para SonarQube self-hosted, troque pelo secret SONAR_HOST_URL.
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      # O Quality Gate bloqueia no PR (antes do merge). Na main o gate já foi validado
      # no PR — lá só rodamos o scan + deploy (evita 403 da API de branch e não trava o deploy).
      - name: SonarQube Quality Gate (bloqueia se reprovar) — só no PR
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 3) Deploy na Vercel — só no push para main (produção), depois que gates + segurança passam
  deploy:
    runs-on: ubuntu-latest
    needs: [gates, integration, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Não bloqueia o pipeline: enquanto o token/escopo da Vercel não estiver 100%,
    # o deploy pode falhar sem derrubar gates+scanner. Ver docs/ci/sonarcloud-setup.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy Vercel (produção)
        run: |
          npm i -g vercel
          vercel pull --yes --environment=production --scope="$VERCEL_ORG_ID" --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --scope="$VERCEL_ORG_ID" --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

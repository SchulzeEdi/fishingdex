# Ambiente local canonico: Postgres + LocalStack (S3/SQS). Fonte unica — environments.md aponta para ca.
version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: "s3,sqs"
    ports: ["4566:4566"]
volumes:
  pgdata:
